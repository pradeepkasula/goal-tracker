server:
  port: ${SERVER_PORT:8080}

app:
  version: "@project.version@"
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production-32-bytes-minimum-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  ai:
    enabled: ${AI_ENABLED:true}
  prediction:
    lookback-days: ${PREDICTION_LOOKBACK_DAYS:30}
    cache-ttl: ${PREDICTION_CACHE_TTL:PT6H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    username: ${SEED_USERNAME:pkasula}
    password: ${SEED_PASSWORD:pkasula}

spring:
  application:
    name: goal-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goaltracker}
    username: ${DB_USERNAME:goaltracker}
    password: ${DB_PASSWORD:goaltracker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1}
    retry:
      max-attempts: 1

logging:
  level:
    com.goaltracker: INFO
